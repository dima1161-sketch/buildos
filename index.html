<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#f5f7fa">
<title>BUILDOS — Big Update 2</title>
<style>
:root{
 --bg:#f5f7fa;--card:#fff;--text:#111827;--muted:#6b7280;--line:#e1e5eb;
 --blue:#2878ed;--green:#16a34a;--red:#dc2626;--orange:#f59e0b;--dark:#111827;
 --shadow:0 2px 12px rgba(17,24,39,.05);
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","Segoe UI",sans-serif}
body{padding-bottom:92px}
button,input,select,textarea{font:inherit}
button{cursor:pointer}
.app{max-width:760px;margin:auto}
header{
 background:#fff;padding:30px 18px 24px;border-bottom:1px solid var(--line);
}
.brand{font-size:25px;font-weight:900;letter-spacing:-1px}.brand span{color:#d99016}
.greeting{font-size:32px;font-weight:850;margin-top:38px;letter-spacing:-1px}
.subtitle{font-size:22px;color:var(--muted);margin-top:10px}
.content{padding:18px 16px}
.pills{display:flex;gap:10px;overflow:auto;padding:2px 0 18px}
.pill{white-space:nowrap;background:#fff;border:1px solid var(--line);border-radius:25px;padding:10px 16px;font-weight:700}
.card{background:var(--card);border:1px solid var(--line);border-radius:28px;padding:20px;margin-bottom:16px;box-shadow:var(--shadow)}
.section-head{display:flex;justify-content:space-between;align-items:center;gap:12px;margin:4px 0 18px}
h1{font-size:38px;margin:0;letter-spacing:-1px}h2{font-size:27px;margin:0 0 16px}h3{font-size:20px;margin:0 0 12px}
.muted{color:var(--muted)}.small{font-size:14px;color:var(--muted)}
.primary,.danger,.secondary{
 border-radius:20px;padding:15px 18px;border:1px solid var(--line);font-weight:800
}
.primary{background:var(--blue);color:#fff;border-color:var(--blue)}
.secondary{background:#fff;color:var(--text)}
.danger{background:#fff;color:var(--red);border-color:#fecaca}
.full{width:100%}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.stat{background:#fff;border:1px solid var(--line);border-radius:25px;padding:18px}
.stat .icon{font-size:30px}.stat .value{font-size:34px;font-weight:850;margin-top:8px}.stat .label{font-size:17px;color:var(--muted);margin-top:4px}
.progress{height:10px;background:#e8edf5;border-radius:99px;overflow:hidden}.progress i{display:block;height:100%;background:var(--blue);border-radius:99px}
.row{display:flex;justify-content:space-between;gap:16px;padding:13px 0;border-bottom:1px solid var(--line)}
.row:last-child{border-bottom:0}.row b{font-weight:800;text-align:right}
.task{display:flex;gap:12px;padding:15px 0;border-bottom:1px solid var(--line);align-items:flex-start}
.check{width:27px;height:27px;border:2px solid #cbd5e1;border-radius:8px;flex:0 0 auto;margin-top:1px}
.check.done{background:var(--green);border-color:var(--green);color:#fff;text-align:center}.check.done:after{content:"✓";font-weight:900}
.task-main{flex:1;min-width:0}.task-title{font-size:18px;font-weight:750}.task-meta{color:var(--muted);font-size:14px;margin-top:5px}
.badge{display:inline-block;padding:5px 9px;border-radius:10px;font-size:12px;font-weight:800}
.badge.high{background:#fee2e2;color:#991b1b}.badge.medium{background:#fef3c7;color:#92400e}.badge.low{background:#dcfce7;color:#166534}
.done-text{text-decoration:line-through;color:var(--muted)}
.money{font-size:30px;font-weight:850}.money.green{color:var(--green)}.money.red{color:var(--red)}
.toolbar{display:flex;gap:8px;overflow:auto;margin-bottom:14px}.filter{padding:9px 13px;border:1px solid var(--line);background:#fff;border-radius:18px;font-weight:700;white-space:nowrap}.filter.active{background:#eaf2ff;color:var(--blue);border-color:#9fc2ff}
.empty{text-align:center;color:var(--muted);padding:34px 10px}
.quick{font-size:18px;font-weight:800;padding:20px 12px}
.list-card{display:block;width:100%;text-align:left;background:#fff;border:1px solid var(--line);border-radius:22px;padding:17px;margin-bottom:10px}
.list-card:active{transform:scale(.99)}
nav{position:fixed;z-index:20;left:0;right:0;bottom:0;background:rgba(255,255,255,.96);border-top:1px solid var(--line);padding:8px max(8px,env(safe-area-inset-left)) calc(8px + env(safe-area-inset-bottom));display:grid;grid-template-columns:repeat(5,1fr);max-width:760px;margin:auto;backdrop-filter:blur(14px)}
nav button{border:0;background:none;color:#6b7280;font-weight:700;font-size:13px;padding:4px 2px}.navicon{font-size:25px;display:block;margin-bottom:3px}.active-nav{color:var(--blue)}
.modal{position:fixed;z-index:50;inset:0;background:rgba(0,0,0,.42);display:none;align-items:flex-end}
.modal.show{display:flex}.sheet{background:#fff;border-radius:30px 30px 0 0;width:100%;max-width:760px;margin:auto;padding:24px 18px calc(20px + env(safe-area-inset-bottom));max-height:92vh;overflow:auto}
.sheet h2{font-size:30px}.field{margin:13px 0}.field label{display:block;font-weight:750;color:#6b7280;margin-bottom:7px}
.field input,.field select,.field textarea{width:100%;border:1px solid #d8dee8;border-radius:17px;padding:15px;background:#fff;outline:none}
.field textarea{min-height:90px;resize:vertical}.actions{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:18px}
.close-x{float:right;border:0;background:#f1f3f6;border-radius:50%;width:38px;height:38px;font-size:22px}
.timeline{border-left:3px solid #cfe0ff;padding-left:15px}.event{padding:8px 0 16px}.event b{display:block}
.table{overflow:auto}.table table{width:100%;border-collapse:collapse;min-width:520px}.table th,.table td{text-align:left;padding:11px;border-bottom:1px solid var(--line)}
.notice{padding:14px;border-radius:16px;background:#eef6ff;color:#245a9a;margin-bottom:12px}
@media(max-width:520px){.greeting{font-size:30px}.grid3{grid-template-columns:1fr 1fr}.stat .value{font-size:30px}}
</style>
</head>
<body>
<div class="app" id="app"></div>

<div class="modal" id="modal"><div class="sheet" id="sheet"></div></div>

<script>
const KEY="buildos_state_v3";
const oldKey="buildos_data";
const defaultState={
 objects:[{
  id:"obj1",name:"ЖК Хорошевский",city:"Москва",area:142,budget:3200000,
  client:"Иван",stage:"Черновые работы",workersCount:6,start:"2026-08-12",finish:"2026-10-25",progress:64,
  issues:0
 }],
 tasks:[
  {id:"t1",title:"Проверить электрику",objectId:"obj1",assignee:"",due:"",priority:"high",done:false},
  {id:"t2",title:"Согласовать плитку",objectId:"obj1",assignee:"",due:"",priority:"medium",done:true},
  {id:"t3",title:"Фотоотчёт заказчику",objectId:"obj1",assignee:"",due:"",priority:"medium",done:false}
 ],
 expenses:[],
 workers:[],
 materials:[],
 events:[],
 clients:[],
 salaries:[],
 estimates:[],
 docs:[],
 timesheets:[]
};
let state=loadState(), view="home", selectedObjectId=state.objects[0]?.id||null, selectedWorkerId=null, taskFilter="all";

function loadState(){
 try{
  const raw=localStorage.getItem(KEY);
  if(raw)const d=JSON.parse(raw);
   return {...structuredClone(defaultState),...d,
    timesheets:d.timesheets||[],materials:d.materials||[],events:d.events||[],clients:d.clients||[],salaries:d.salaries||[],estimates:d.estimates||[],docs:d.docs||[]};
  const old=localStorage.getItem(oldKey);
  if(old){
   const d=JSON.parse(old);
   return {...defaultState,tasks:d.tasks||defaultState.tasks,objects:d.objects||defaultState.objects};
  }
 }catch(e){}
 return structuredClone(defaultState);
}
function save(){localStorage.setItem(KEY,JSON.stringify(state));}
function money(n){return new Intl.NumberFormat("ru-RU").format(Math.round(n||0))+" ₽"}
function dateRu(s){if(!s)return"Без срока";try{return new Date(s+"T00:00:00").toLocaleDateString("ru-RU",{day:"numeric",month:"long"})}catch(e){return s}}
function esc(s){return String(s??"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[m]))}
function obj(id){return state.objects.find(x=>x.id===id)}
function expensesFor(id){return state.expenses.filter(x=>x.objectId===id)}
function totalSpent(id){return expensesFor(id).reduce((s,x)=>s+Number(x.amount||0),0)}
function openTasks(id){return state.tasks.filter(t=>t.objectId===id&&!t.done)}
function render(){
 document.getElementById("app").innerHTML=`
 <header>
  <div class="brand">BUILD<span>OS</span></div>
  <div class="greeting">Добрый день, Дмитрий 👋</div>
  <div class="subtitle">Вот что происходит на объектах</div>
 </header>
 <main class="content">${page()}</main>${nav()}
 `;
}
function nav(){
 const items=[["home","🏠","Главная"],["objects","🏗️","Объекты"],["tasks","✅","Задачи"],["finance","💰","Финансы"],["more","•••","Ещё"]];
 return `<nav>${items.map(x=>`<button class="${view===x[0]?"active-nav":""}" onclick="go('${x[0]}')"><span class="navicon">${x[1]}</span>${x[2]}</button>`).join("")}</nav>`;
}
function topPills(){
 const profit=state.objects.reduce((s,o)=>s+o.budget-totalSpent(o.id),0);
 const workers=state.workers.length||state.objects.reduce((s,o)=>s+(o.workersCount||0),0);
 const issues=state.objects.reduce((s,o)=>s+(o.issues||0),0);
 return `<div class="pills"><span class="pill">BUILDOS</span><span class="pill">Остаток ${money(profit)}</span><span class="pill">👷 ${workers}</span><span class="pill">⚠️ ${issues}</span></div>`;
}
function page(){
 if(view==="home")return home();
 if(view==="objects")return objectsPage();
 if(view==="object")return objectPage();
 if(view==="tasks")return tasksPage();
 if(view==="finance")return financePage();
 if(view==="workers")return workersPage();
 if(view==="worker")return workerDetailPage();
 if(view==="calendar")return calendarPage();
 if(view==="materials")return materialsPage();
 if(view==="reports")return reportsPage();
 if(view==="clients")return simpleListPage("👤 Клиенты",state.clients,["Имя","Телефон","Комментарий"],"client");
 if(view==="estimates")return estimatesPage();
 if(view==="docs")return simpleListPage("📁 Документы",state.docs,["Название","Тип","Объект"],"doc");
 if(view==="salary")return salaryPage();
 if(view==="more")return morePage();
 if(view==="ai")return aiPage();
 return home();
}
function home(){
 const open=state.tasks.filter(t=>!t.done).length, overdue=state.tasks.filter(t=>!t.done&&t.due&&t.due<new Date().toISOString().slice(0,10)).length;
 const spent=state.expenses.reduce((s,x)=>s+Number(x.amount||0),0);
 const workers=state.workers.length||state.objects.reduce((s,o)=>s+(o.workersCount||0),0);
 return `${topPills()}
 <div class="section-head"><h1>Сегодня</h1></div>
 <div class="grid2">
  ${stat("🔴",overdue,"просрочено")}${stat("📋",open,"в работе")}
  ${stat("💰",money(spent),"расходы")}${stat("👷",workers,"рабочих")}
 </div>
 <div class="card" style="margin-top:16px"><h2>⚡ Быстрые действия</h2>
  <div class="grid2">
   <button class="secondary quick" onclick="openTask()">＋ Задача</button>
   <button class="secondary quick" onclick="go('objects')">🏗️ Объекты</button>
   <button class="secondary quick" onclick="openExpense()">💸 Расход</button>
   <button class="secondary quick" onclick="go('calendar')">📅 Календарь</button>
  </div>
 </div>
 <div class="card"><h2>🏗️ Объекты</h2>${state.objects.map(o=>`
  <button class="list-card" onclick="selectedObjectId='${o.id}';go('object')">
   <b style="font-size:19px">${esc(o.name)}</b><div class="muted">${esc(o.city)} · ${o.area} м²</div>
   <div style="margin:12px 0" class="progress"><i style="width:${o.progress||0}%"></i></div>
   <b>Готовность ${o.progress||0}%</b>
  </button>`).join("")}</div>`;
}
function stat(i,v,l){return `<div class="stat"><div class="icon">${i}</div><div class="value">${v}</div><div class="label">${l}</div></div>`}
function objectsPage(){
 return `${topPills()}<div class="section-head"><h1>Объекты</h1><button class="primary" onclick="openObject()">＋ Добавить</button></div>
 ${state.objects.map(o=>`<button class="list-card" onclick="selectedObjectId='${o.id}';go('object')">
 <div style="display:flex;gap:14px;align-items:center"><div style="font-size:45px">🏗️</div><div><b style="font-size:24px">${esc(o.name)}</b><div class="muted">${esc(o.city)} · ${o.area} м²</div></div></div>
 <div style="margin:14px 0" class="progress"><i style="width:${o.progress||0}%"></i></div>
 <b>Готовность ${o.progress||0}%</b><div class="small">${o.stage||""} · бюджет ${money(o.budget)}</div></button>`).join("")}`;
}
function objectPage(){
 const o=obj(selectedObjectId); if(!o)return objectsPage();
 const spent=totalSpent(o.id), remaining=o.budget-spent, tasks=openTasks(o.id);
 return `${topPills()}
 <div class="card"><button class="secondary" onclick="go('objects')">← Все объекты</button>
 <div style="display:flex;gap:15px;align-items:center;margin:22px 0"><div style="font-size:54px">🏗️</div><div><h1 style="font-size:34px">${esc(o.name)}</h1><div class="muted">${esc(o.city)} · ${o.area} м²</div></div></div>
 <div class="progress"><i style="width:${o.progress}%"></i></div><h2 style="margin-top:12px">Готовность ${o.progress}%</h2></div>
 <div class="card"><h2>💰 Финансы объекта</h2><div class="grid2">
 ${stat("",""+money(o.budget),"бюджет")}${stat("",money(spent),"потрачено")}
 ${stat("",money(remaining),remaining>=0?"осталось":"перерасход")}${stat("",""+(o.budget?Math.round(spent/o.budget*100):0)+"%","освоено")}
 </div><div style="margin:16px 0" class="progress"><i style="width:${Math.min(100,o.budget?spent/o.budget*100:0)}%"></i></div>
 <button class="primary full" onclick="openExpense('${o.id}')">＋ Добавить расход</button></div>
 <div class="card"><h2>📋 Основная информация</h2>
 ${row("Клиент",o.client)}${row("Этап",o.stage)}${row("Рабочие",o.workersCount+" человек")}${row("Начало",dateRu(o.start))}${row("Сдача",dateRu(o.finish))}</div>
 <div class="card"><div class="section-head"><h2>📋 Задачи объекта</h2><button class="secondary" onclick="openTask('${o.id}')">＋</button></div>
 ${tasks.length?tasks.map(taskHtml).join(""):"<div class='empty'>Все задачи выполнены 🎉</div>"}</div>
 <div class="grid2"><button class="secondary" onclick="go('calendar')">📅 Календарь</button><button class="secondary" onclick="go('materials')">📦 Материалы</button></div>`;
}
function row(a,b){return `<div class="row"><span>${a}</span><b>${esc(b)}</b></div>`}
function tasksPage(){
 let list=state.tasks.filter(t=>taskFilter==="all"||(taskFilter==="done"?t.done:!t.done));
 return `${topPills()}<div class="section-head"><h1>Задачи</h1><button class="primary" onclick="openTask()">＋ Добавить</button></div>
 <div class="toolbar">${["all","open","done"].map(f=>`<button class="filter ${taskFilter===f?"active":""}" onclick="taskFilter='${f}';render()">${f==="all"?"Все":f==="open"?"В работе":"Выполнены"}</button>`).join("")}</div>
 <div class="card"><div class="muted">Всего: ${state.tasks.length} · В работе: ${state.tasks.filter(t=>!t.done).length} · Выполнено: ${state.tasks.filter(t=>t.done).length}</div>
 ${list.length?list.map(taskHtml).join(""):"<div class='empty'>Задач нет.</div>"}</div>`;
}
function taskHtml(t){
 const o=obj(t.objectId);
 return `<div class="task" onclick="editTask('${t.id}')"><div class="check ${t.done?"done":""}" onclick="event.stopPropagation();toggleTask('${t.id}')"></div>
 <div class="task-main"><div class="task-title ${t.done?"done-text":""}">${esc(t.title)}</div>
 <div class="task-meta">🏗️ ${esc(o?.name||"Без объекта")} · 👷 ${esc(t.assignee||"Не назначен")} · 📅 ${dateRu(t.due)}</div>
 <span class="badge ${t.priority||"medium"}">${t.priority==="high"?"Высокий":t.priority==="low"?"Низкий":"Средний"}</span>
 </div></div>`;
}
function financePage(){
 const total=state.expenses.reduce((s,x)=>s+Number(x.amount||0),0);
 return `${topPills()}<div class="section-head"><h1>Финансы</h1><button class="primary" onclick="openExpense()">＋ Расход</button></div>
 <div class="grid2">${stat("💰",money(total),"все расходы")}${stat("📊",state.expenses.length,"операций")}</div>
 <div class="card"><h2>Расходы</h2>${state.expenses.length?state.expenses.slice().reverse().map(e=>`
 <div class="row"><div><b>${esc(e.category)}</b><div class="small">${esc(obj(e.objectId)?.name||"Без объекта")} · ${dateRu(e.date)}</div>${e.comment?`<div class="small">${esc(e.comment)}</div>`:""}</div><b class="money red">− ${money(e.amount)}</b></div>`).join(""):"<div class='empty'>Расходов пока нет.</div>"}</div>`;
}
function workerStats(w){
 const days=state.timesheets.filter(x=>x.workerId===w.id&&x.status==="worked").length;
 const advances=state.salaries.filter(x=>x.workerId===w.id).reduce((s,x)=>s+Number(x.amount||0),0);
 const earned=days*Number(w.rate||0);
 return {days,advances,earned,balance:earned-advances};
}
function workersPage(){
 return `${topPills()}<div class="section-head"><h1>Рабочие</h1><button class="primary" onclick="openWorker()">＋ Добавить</button></div>
 <div class="grid2"><div class="stat"><div class="icon">👷</div><div class="value">${state.workers.length}</div><div class="label">рабочих</div></div>
 <div class="stat"><div class="icon">📅</div><div class="value">${state.timesheets.filter(x=>x.status==="worked").length}</div><div class="label">отработано дней</div></div></div>
 <div class="card" style="margin-top:16px"><h2>👷 Команда</h2>
 ${state.workers.length?state.workers.map(w=>{const s=workerStats(w);return `<button class="list-card" onclick="workerDetail('${w.id}')">
 <div style="display:flex;justify-content:space-between;gap:12px"><div><b style="font-size:20px">${esc(w.name)}</b><div class="muted">${esc(w.role||"Рабочий")}</div></div><b>${money(w.rate||0)} / день</b></div>
 <div class="grid3" style="margin-top:14px"><div><div class="small">Дни</div><b>${s.days}</b></div><div><div class="small">Начислено</div><b>${money(s.earned)}</b></div><div><div class="small">Баланс</div><b class="${s.balance<0?"money red":"money green"}" style="font-size:16px">${money(s.balance)}</b></div></div>
 <div class="small" style="margin-top:8px">🏗️ ${esc(obj(w.objectId)?.name||"—")}</div></button>`}).join(""):"<div class='empty'>Рабочих пока нет. Добавь первого.</div>"}
 </div>`;
}
function calendarPage(){
 const ev=[...state.events.map(e=>({...e,type:"event"})),...state.tasks.filter(t=>t.due).map(t=>({date:t.due,title:t.title,type:"task"}))].sort((a,b)=>(a.date||"").localeCompare(b.date||""));
 return `${topPills()}<div class="section-head"><h1>Календарь</h1><button class="primary" onclick="openEvent()">＋ Событие</button></div>
 <div class="card"><div class="timeline">${ev.length?ev.map(e=>`<div class="event"><b>${dateRu(e.date)} · ${e.type==="task"?"📋":"📅"}</b><span>${esc(e.title)}</span><div class="small">${esc(e.comment||"")}</div></div>`).join(""):"<div class='empty'>Событий и задач со сроком пока нет.</div>"}</div></div>`;
}
function materialsPage(){
 return `${topPills()}<div class="section-head"><h1>Материалы</h1><button class="primary" onclick="openMaterial()">＋ Добавить</button></div>
 <div class="card">${state.materials.length?state.materials.map(m=>`<div class="row"><div><b>${esc(m.name)}</b><div class="small">${esc(obj(m.objectId)?.name||"—")} · ${esc(m.supplier||"Без поставщика")}</div><div class="small">${m.qty} ${esc(m.unit||"шт")} · ${dateRu(m.date)}</div></div><b>${money(m.amount)}</b></div>`).join(""):"<div class='empty'>Материалов пока нет.</div>"}</div>`;
}
function reportsPage(){
 const totalBudget=state.objects.reduce((s,o)=>s+o.budget,0), spent=state.expenses.reduce((s,e)=>s+Number(e.amount||0),0);
 return `${topPills()}<div class="section-head"><h1>Отчёты</h1></div>
 <div class="card"><h2>📊 Сводка по проектам</h2>${row("Объектов",state.objects.length)}${row("Общий бюджет",money(totalBudget))}${row("Потрачено",money(spent))}${row("Остаток",money(totalBudget-spent))}${row("Задач всего",state.tasks.length)}${row("Задач в работе",state.tasks.filter(t=>!t.done).length)}</div>
 <div class="card"><h2>🏗️ По объектам</h2>${state.objects.map(o=>{let s=totalSpent(o.id);return `<div class="row"><div><b>${esc(o.name)}</b><div class="small">${o.progress}% готовности</div></div><b>${money(s)} / ${money(o.budget)}</b></div>`}).join("")}</div>`;
}
function simpleListPage(title,data,labels,type){

 return `${topPills()}<h1>Ещё</h1><div class="grid2" style="margin-top:18px">
 ${moreBtn("🤖","AI-помощник","ai")}${moreBtn("📦","Материалы","materials")}${moreBtn("👷","Рабочие","workers")}${moreBtn("📅","Табель","workers")}${moreBtn("📊","Отчёты","reports")}${moreBtn("👤","Клиенты","clients")}${moreBtn("📋","Сметы","estimates")}${moreBtn("📁","Документы","docs")}${moreBtn("💵","Зарплата","salary")}</div>

function modal(title,body){
 document.getElementById("sheet").innerHTML=`<button class="close-x" onclick="closeModal()">×</button><h2>${title}</h2>${body}`;
 document.getElementById("modal").classList.add("show");
}
function closeModal(){document.getElementById("modal").classList.remove("show")}
function openTask(objectId=selectedObjectId){
 modal("Новая задача",`<div class="field"><label>Задача</label><input id="fTitle" placeholder="Например: проверить электрику"></div>
 <div class="field"><label>Объект</label><select id="fObj">${state.objects.map(o=>`<option value="${o.id}" ${o.id===objectId?"selected":""}>${esc(o.name)}</option>`).join("")}</select></div>
 <div class="field"><label>Ответственный</label><input id="fAssignee" placeholder="Например: Сергей"></div>
 <div class="field"><label>Срок</label><input id="fDue" type="date"></div>
 <div class="field"><label>Приоритет</label><select id="fPriority"><option value="medium">🟠 Средний</option><option value="high">🔴 Высокий</option><option value="low">🟢 Низкий</option></select></div>
 <div class="actions"><button class="secondary" onclick="closeModal()">Отмена</button><button class="primary" onclick="addTask()">Сохранить</button></div>`);
}
function addTask(){
 const title=document.getElementById("fTitle").value.trim();if(!title)return;
 state.tasks.unshift({id:crypto.randomUUID(),title,objectId:document.getElementById("fObj").value,assignee:document.getElementById("fAssignee").value.trim(),due:document.getElementById("fDue").value,priority:document.getElementById("fPriority").value,done:false});
 save();closeModal();render();
}
function editTask(id){
 const t=state.tasks.find(x=>x.id===id);if(!t)return;
 modal("Редактировать задачу",`<div class="field"><label>Задача</label><input id="fTitle" value="${esc(t.title)}"></div>
 <div class="field"><label>Объект</label><select id="fObj">${state.objects.map(o=>`<option value="${o.id}" ${o.id===t.objectId?"selected":""}>${esc(o.name)}</option>`).join("")}</select></div>
 <div class="field"><label>Ответственный</label><input id="fAssignee" value="${esc(t.assignee||"")}"></div>
 <div class="field"><label>Срок</label><input id="fDue" type="date" value="${t.due||""}"></div>
 <div class="field"><label>Приоритет</label><select id="fPriority"><option value="medium">🟠 Средний</option><option value="high">🔴 Высокий</option><option value="low">🟢 Низкий</option></select></div>
 <div class="actions"><button class="danger" onclick="deleteTask('${id}')">Удалить</button><button class="primary" onclick="updateTask('${id}')">Сохранить</button></div>`);
 document.getElementById("fPriority").value=t.priority||"medium";
}
function updateTask(id){const t=state.tasks.find(x=>x.id===id);t.title=document.getElementById("fTitle").value.trim();t.objectId=document.getElementById("fObj").value;t.assignee=document.getElementById("fAssignee").value.trim();t.due=document.getElementById("fDue").value;t.priority=document.getElementById("fPriority").value;save();closeModal();render()}
function deleteTask(id){state.tasks=state.tasks.filter(t=>t.id!==id);save();closeModal();render()}
function toggleTask(id){const t=state.tasks.find(x=>x.id===id);t.done=!t.done;save();render()}
function openExpense(objectId=selectedObjectId){
 modal("Новый расход",`<div class="field"><label>Объект</label><select id="eObj">${state.objects.map(o=>`<option value="${o.id}" ${o.id===objectId?"selected":""}>${esc(o.name)}</option>`).join("")}</select></div>
 <div class="field"><label>Статья</label><input id="eCat" placeholder="Материалы, рабочие, доставка..."></div>
 <div class="field"><label>Сумма</label><input id="eAmount" type="number" inputmode="decimal" placeholder="50000"></div>
 <div class="field"><label>Дата</label><input id="eDate" type="date" value="${new Date().toISOString().slice(0,10)}"></div>
 <div class="field"><label>Комментарий</label><input id="eComment" placeholder="Что купили?"></div>
 <div class="actions"><button class="secondary" onclick="closeModal()">Отмена</button><button class="primary" onclick="addExpense()">Добавить</button></div>`);
}
function addExpense(){const amount=Number(document.getElementById("eAmount").value);if(!amount)return;state.expenses.push({id:crypto.randomUUID(),objectId:document.getElementById("eObj").value,category:document.getElementById("eCat").value||"Без категории",amount,date:document.getElementById("eDate").value,comment:document.getElementById("eComment").value});save();closeModal();render()}

function workerDetailPage(){
 const w=state.workers.find(x=>x.id===selectedWorkerId); if(!w)return workersPage();
 const s=workerStats(w);
 const rows=state.timesheets.filter(x=>x.workerId===w.id).slice().sort((a,b)=>(b.date||"").localeCompare(a.date||""));
 return `${topPills()}<div class="section-head"><h1>Рабочий</h1><button class="secondary" onclick="go('workers')">← Команда</button></div>
 <div class="card"><div style="display:flex;justify-content:space-between;gap:12px"><div><h2>${esc(w.name)}</h2><div class="muted">${esc(w.role||"Рабочий")} · ${esc(obj(w.objectId)?.name||"Без объекта")}</div></div><button class="secondary" onclick="editWorker('${w.id}')">Изменить</button></div>
 <div class="grid2" style="margin-top:18px">${stat("📅",s.days,"отработано дней")}${stat("💰",money(s.earned),"начислено")}${stat("💸",money(s.advances),"выплачено")}${stat("🧾",money(s.balance),"к выплате")}</div></div>
 <div class="card"><div class="section-head"><h2>📅 Табель</h2><button class="primary" onclick="openTimesheet('${w.id}')">＋ День</button></div>
 ${rows.length?rows.map(x=>`<div class="row"><div><b>${dateRu(x.date)}</b><div class="small">${x.status==="worked"?"Работал":"Не работал"}${x.comment?" · "+esc(x.comment):""}</div></div><b>${x.status==="worked"?money(w.rate||0):"0 ₽"}</b></div>`).join(""):"<div class='empty'>Табель пока пуст.</div>"}</div>
 <div class="card"><h2>💵 Выплаты</h2>${state.salaries.filter(x=>x.workerId===w.id).length?state.salaries.filter(x=>x.workerId===w.id).slice().reverse().map(x=>`<div class="row"><span>${dateRu(x.date)}</span><b>${money(x.amount)}</b></div>`).join(""):"<div class='empty'>Выплат пока нет.</div>"}</div>`;
}
function workerDetail(id){selectedWorkerId=id;go("worker")}
function openTimesheet(workerId){
 const w=state.workers.find(x=>x.id===workerId);
 modal("Отметить день",`<div class="field"><label>Рабочий</label><input value="${esc(w?.name||"")}" disabled></div>
 <div class="field"><label>Дата</label><input id="tsDate" type="date" value="${new Date().toISOString().slice(0,10)}"></div>
 <div class="field"><label>Статус</label><select id="tsStatus"><option value="worked">Работал</option><option value="off">Не работал</option></select></div>
 <div class="field"><label>Комментарий</label><input id="tsComment" placeholder="Например: полный день"></div>
 <div class="actions"><button class="secondary" onclick="closeModal()">Отмена</button><button class="primary" onclick="addTimesheet('${workerId}')">Сохранить</button></div>`);
}
function addTimesheet(workerId){
 const date=document.getElementById("tsDate").value;if(!date)return;
 state.timesheets=state.timesheets.filter(x=>!(x.workerId===workerId&&x.date===date));
 state.timesheets.push({id:crypto.randomUUID(),workerId,date,status:document.getElementById("tsStatus").value,comment:document.getElementById("tsComment").value});
 save();closeModal();selectedWorkerId=workerId;render();
}
function estimatesPage(){
 const total=state.estimates.reduce((s,x)=>s+Number(x.amount||0),0);
 return `${topPills()}<div class="section-head"><h1>Сметы</h1><button class="primary" onclick="openEstimate()">＋ Смета</button></div>
 <div class="card"><h2>📋 Общая сумма</h2><div class="money">${money(total)}</div></div>
 ${state.estimates.length?state.estimates.map(e=>`<button class="list-card" onclick="estimateDetail('${e.id}')"><div style="display:flex;justify-content:space-between;gap:10px"><div><b style="font-size:19px">${esc(e.name)}</b><div class="muted">${esc(obj(e.objectId)?.name||"Без объекта")}</div></div><b>${money(e.amount)}</b></div><div class="small" style="margin-top:10px">${(e.items||[]).length} позиций</div></button>`).join(""):"<div class='card empty'>Смет пока нет. Создай первую.</div>"}`;
}
let selectedEstimateId=null;
function estimateDetail(id){
 selectedEstimateId=id;
 const e=state.estimates.find(x=>x.id===id);if(!e)return;
 modal("Смета: "+esc(e.name),`<div class="notice">Объект: <b>${esc(obj(e.objectId)?.name||"—")}</b><br>Итого: <b>${money(e.amount)}</b></div>
 ${(e.items||[]).length?`<div class="table"><table><thead><tr><th>Позиция</th><th>Кол-во</th><th>Цена</th><th>Сумма</th></tr></thead><tbody>${e.items.map(i=>`<tr><td>${esc(i.name)}</td><td>${i.qty} ${esc(i.unit)}</td><td>${money(i.price)}</td><td>${money(i.qty*i.price)}</td></tr>`).join("")}</tbody></table></div>`:"<div class='empty'>Позиций пока нет.</div>"}
 <div class="actions"><button class="secondary" onclick="closeModal()">Закрыть</button><button class="primary" onclick="openEstimateItem('${id}')">＋ Позиция</button></div>`);
}
function openEstimate(){
 modal("Новая смета",`<div class="field"><label>Название</label><input id="estName" placeholder="Смета на ремонт"></div><div class="field"><label>Объект</label><select id="estObj">${state.objects.map(o=>`<option value="${o.id}">${esc(o.name)}</option>`).join("")}</select></div><div class="actions"><button class="secondary" onclick="closeModal()">Отмена</button><button class="primary" onclick="addEstimate()">Создать</button></div>`);
}
function addEstimate(){const name=document.getElementById("estName").value.trim();if(!name)return;state.estimates.push({id:crypto.randomUUID(),name,objectId:document.getElementById("estObj").value,amount:0,items:[]});save();closeModal();render()}
function openEstimateItem(id){
 modal("Позиция сметы",`<div class="field"><label>Наименование</label><input id="eiName" placeholder="Штукатурка"></div><div class="grid2"><div class="field"><label>Количество</label><input id="eiQty" type="number" value="1"></div><div class="field"><label>Единица</label><input id="eiUnit" value="шт"></div></div><div class="field"><label>Цена</label><input id="eiPrice" type="number" placeholder="1000"></div><div class="actions"><button class="secondary" onclick="closeModal()">Отмена</button><button class="primary" onclick="addEstimateItem('${id}')">Добавить</button></div>`);
}
function addEstimateItem(id){
 const e=state.estimates.find(x=>x.id===id);const name=document.getElementById("eiName").value.trim();if(!name)return;
 const qty=Number(document.getElementById("eiQty").value)||0,price=Number(document.getElementById("eiPrice").value)||0;
 e.items=e.items||[];e.items.push({id:crypto.randomUUID(),name,qty,unit:document.getElementById("eiUnit").value,price});e.amount=e.items.reduce((s,i)=>s+i.qty*i.price,0);
 save();closeModal();estimateDetail(id);
}

function openWorker(){
 modal("Новый рабочий",`<div class="field"><label>ФИО</label><input id="wName" placeholder="Например: Сергей Иванов"></div><div class="field"><label>Специальность</label><input id="wRole" placeholder="Плиточник"></div><div class="field"><label>Ставка</label><input id="wRate" type="number" placeholder="5000"></div><div class="field"><label>Объект</label><select id="wObj">${state.objects.map(o=>`<option value="${o.id}">${esc(o.name)}</option>`).join("")}</select></div><div class="actions"><button class="secondary" onclick="closeModal()">Отмена</button><button class="primary" onclick="addWorker()">Добавить</button></div>`);
}
function addWorker(){const name=document.getElementById("wName").value.trim();if(!name)return;state.workers.push({id:crypto.randomUUID(),name,role:document.getElementById("wRole").value,rate:Number(document.getElementById("wRate").value)||0,objectId:document.getElementById("wObj").value});save();closeModal();render()}
function editWorker(id){
 const w=state.workers.find(x=>x.id===id);if(!w)return;
 modal("Рабочий",`<div class="field"><label>ФИО</label><input id="wName" value="${esc(w.name)}"></div><div class="field"><label>Специальность</label><input id="wRole" value="${esc(w.role||"")}"></div><div class="field"><label>Ставка</label><input id="wRate" type="number" value="${w.rate||0}"></div><div class="actions"><button class="danger" onclick="state.workers=state.workers.filter(x=>x.id!=='${id}');save();closeModal();render()">Удалить</button><button class="primary" onclick="w.name=document.getElementById('wName').value;w.role=document.getElementById('wRole').value;w.rate=Number(document.getElementById('wRate').value)||0;save();closeModal();render()">Сохранить</button></div>`);
}
function openMaterial(){
 modal("Новый материал",`<div class="field"><label>Материал</label><input id="mName" placeholder="Плитка, цемент, краска..."></div><div class="field"><label>Объект</label><select id="mObj">${state.objects.map(o=>`<option value="${o.id}">${esc(o.name)}</option>`).join("")}</select></div><div class="field"><label>Количество</label><input id="mQty" type="number" placeholder="10"></div><div class="field"><label>Единица</label><input id="mUnit" value="шт"></div><div class="field"><label>Сумма</label><input id="mAmount" type="number" placeholder="50000"></div><div class="field"><label>Поставщик</label><input id="mSup" placeholder="Компания"></div><div class="field"><label>Дата</label><input id="mDate" type="date" value="${new Date().toISOString().slice(0,10)}"></div><div class="actions"><button class="secondary" onclick="closeModal()">Отмена</button><button class="primary" onclick="addMaterial()">Добавить</button></div>`);
}
function addMaterial(){const name=document.getElementById("mName").value.trim();if(!name)return;state.materials.push({id:crypto.randomUUID(),name,objectId:document.getElementById("mObj").value,qty:Number(document.getElementById("mQty").value)||0,unit:document.getElementById("mUnit").value,amount:Number(document.getElementById("mAmount").value)||0,supplier:document.getElementById("mSup").value,date:document.getElementById("mDate").value});save();closeModal();render()}
function openEvent(){
 modal("Новое событие",`<div class="field"><label>Название</label><input id="vTitle" placeholder="Поставка материалов"></div><div class="field"><label>Дата</label><input id="vDate" type="date"></div><div class="field"><label>Комментарий</label><textarea id="vComment"></textarea></div><div class="actions"><button class="secondary" onclick="closeModal()">Отмена</button><button class="primary" onclick="addEvent()">Добавить</button></div>`);
}
function addEvent(){const title=document.getElementById("vTitle").value.trim();if(!title)return;state.events.push({id:crypto.randomUUID(),title,date:document.getElementById("vDate").value,comment:document.getElementById("vComment").value});save();closeModal();render()}
function openObject(){
 modal("Новый объект",`<div class="field"><label>Название</label><input id="oName" placeholder="Например: ЖК Хорошевский"></div><div class="field"><label>Город</label><input id="oCity" value="Москва"></div><div class="field"><label>Площадь, м²</label><input id="oArea" type="number"></div><div class="field"><label>Бюджет</label><input id="oBudget" type="number"></div><div class="field"><label>Клиент</label><input id="oClient"></div><div class="field"><label>Этап</label><input id="oStage" placeholder="Черновые работы"></div><div class="field"><label>Начало</label><input id="oStart" type="date"></div><div class="field"><label>Сдача</label><input id="oFinish" type="date"></div><div class="actions"><button class="secondary" onclick="closeModal()">Отмена</button><button class="primary" onclick="addObject()">Добавить</button></div>`);
}
function addObject(){const name=document.getElementById("oName").value.trim();if(!name)return;const o={id:crypto.randomUUID(),name,city:document.getElementById("oCity").value,area:Number(document.getElementById("oArea").value)||0,budget:Number(document.getElementById("oBudget").value)||0,client:document.getElementById("oClient").value,stage:document.getElementById("oStage").value,start:document.getElementById("oStart").value,finish:document.getElementById("oFinish").value,progress:0,issues:0,workersCount:0};state.objects.push(o);selectedObjectId=o.id;save();closeModal();render()}
function openSalary(){
 modal("Новая выплата",`<div class="field"><label>Рабочий</label><select id="sWorker">${state.workers.map(w=>`<option value="${w.id}">${esc(w.name)}</option>`).join("")}</select></div><div class="field"><label>Сумма</label><input id="sAmount" type="number" placeholder="30000"></div><div class="field"><label>Дата</label><input id="sDate" type="date" value="${new Date().toISOString().slice(0,10)}"></div><div class="actions"><button class="secondary" onclick="closeModal()">Отмена</button><button class="primary" onclick="addSalary()">Добавить</button></div>`);
}
function addSalary(){if(!state.workers.length){alert("Сначала добавь рабочего.");return}const amount=Number(document.getElementById("sAmount").value);if(!amount)return;state.salaries.push({id:crypto.randomUUID(),workerId:document.getElementById("sWorker").value,amount,date:document.getElementById("sDate").value});save();closeModal();render()}
function openSimple(type){
 const map={client:["Новый клиент","Имя","Телефон"],estimate:["Новая смета","Название","Сумма"],doc:["Новый документ","Название","Тип"]};const x=map[type];
 modal(x[0],`<div class="field"><label>${x[1]}</label><input id="q1"></div><div class="field"><label>${x[2]}</label><input id="q2"></div><div class="field"><label>Объект</label><select id="q3"><option value="">Без объекта</option>${state.objects.map(o=>`<option value="${o.id}">${esc(o.name)}</option>`).join("")}</select></div><div class="actions"><button class="secondary" onclick="closeModal()">Отмена</button><button class="primary" onclick="addSimple('${type}')">Добавить</button></div>`);
}
function addSimple(type){
 const x={id:crypto.randomUUID(),name:document.getElementById("q1").value,objectId:document.getElementById("q3").value};
 if(type==="client"){x.phone=document.getElementById("q2").value;state.clients.push(x)}
 if(type==="estimate"){x.amount=Number(document.getElementById("q2").value)||0;state.estimates.push(x)}
 if(type==="doc"){x.type=document.getElementById("q2").value;state.docs.push(x)}
 save();closeModal();render();
}
function askAI(){
 const q=(document.getElementById("aiQ").value||"").toLowerCase(), a=document.getElementById("aiA");
 const overdue=state.tasks.filter(t=>!t.done&&t.due&&t.due<new Date().toISOString().slice(0,10));
 if(q.includes("просроч")||q.includes("долг")) a.innerHTML=`<div class="notice"><b>Просроченные задачи: ${overdue.length}</b><br>${overdue.map(t=>esc(t.title)).join("<br>")||"Нет просроченных задач."}</div>`;
 else if(q.includes("завтра")) a.innerHTML=`<div class="notice"><b>Задачи со сроком:</b><br>${state.tasks.filter(t=>t.due).map(t=>`${dateRu(t.due)} — ${esc(t.title)}`).join("<br>")||"Нет задач со сроками."}</div>`;
 else a.innerHTML=`<div class="notice">Сейчас в системе ${state.objects.length} объект(а), ${state.tasks.filter(t=>!t.done).length} задач в работе и расходов на ${money(state.expenses.reduce((s,x)=>s+Number(x.amount||0),0))}.</div>`;
}
function exportData(){
 const blob=new Blob([JSON.stringify(state,null,2)],{type:"application/json"}),url=URL.createObjectURL(blob),a=document.createElement("a");a.href=url;a.download="buildos-backup.json";a.click();URL.revokeObjectURL(url);
}
function resetData(){if(confirm("Сбросить данные к тестовым?")){localStorage.removeItem(KEY);state=structuredClone(defaultState);selectedObjectId=state.objects[0]?.id;render()}}
function go(v){view=v;render();window.scrollTo(0,0)}
render();
</script>
