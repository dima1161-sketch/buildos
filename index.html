<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>BUILDOS</title>
<style>
:root{--bg:#f5f7fa;--card:#fff;--text:#111827;--muted:#6b7280;--line:#e5e7eb;--blue:#2875ed;--green:#16a34a;--red:#dc2626;--orange:#f59e0b}
*{box-sizing:border-box}
html,body{margin:0;padding:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif}
body{min-height:100vh}
button,input,select{font:inherit}
button{cursor:pointer}
.app{max-width:430px;margin:0 auto;min-height:100vh;padding-bottom:92px}
header{background:#fff;padding:24px 18px 18px;border-bottom:1px solid var(--line)}
.brand{font-size:25px;font-weight:850;letter-spacing:-1px}.brand span{color:#f2a21a}
.greeting{margin-top:20px;font-size:25px;font-weight:800}.subtitle{margin-top:8px;font-size:17px;color:var(--muted)}
.content{padding:18px 16px}
.view{display:none}.view.active{display:block}
.section-head{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:14px}
h2{font-size:28px;margin:0;font-weight:850}
h3{margin:0 0 12px;font-size:22px}
.card,.detail-card{background:var(--card);border:1px solid var(--line);border-radius:24px;padding:18px;margin-bottom:14px;box-shadow:0 2px 10px rgba(17,24,39,.04)}
.object-card{cursor:pointer}
.object-top{display:flex;gap:14px;align-items:center}
.icon{width:68px;height:68px;border-radius:20px;background:#e8eef7;display:grid;place-items:center;font-size:38px;flex:none}
.object-name{font-size:23px;font-weight:850}.object-meta{font-size:16px;color:var(--muted);margin-top:4px}
.progress{height:9px;background:#e9edf3;border-radius:99px;overflow:hidden;margin-top:18px}.progress i{display:block;height:100%;background:var(--blue);border-radius:99px}
.status{font-size:15px;font-weight:750;margin-top:10px}.status.ok{color:var(--green)}.status.bad{color:#ef4444}
.primary{width:100%;border:0;background:var(--blue);color:#fff;border-radius:18px;padding:15px 18px;font-size:20px;font-weight:800}
.secondary{border:1px solid var(--line);background:#fff;border-radius:16px;padding:12px 14px;color:var(--text);font-weight:700}
.danger{border:1px solid #fecaca;background:#fff;color:var(--red);border-radius:16px;padding:12px 14px;font-weight:700}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.grid .secondary{width:100%;min-height:50px}
.detail-title{font-size:25px;font-weight:850}
.row{display:flex;justify-content:space-between;gap:15px;padding:13px 0;border-bottom:1px solid var(--line);font-size:17px}.row:last-child{border-bottom:0}.row b{font-weight:800}
.badge{display:inline-block;padding:5px 9px;border-radius:999px;font-size:12px;font-weight:800}
.badge.red{background:#fee2e2;color:#b91c1c}.badge.orange{background:#fff7ed;color:#c2410c}.badge.green{background:#ecfdf5;color:#15803d}
.task-tools{display:flex;gap:8px;margin-bottom:12px;overflow:auto}.task-filter{white-space:nowrap;border:1px solid var(--line);background:#fff;border-radius:999px;padding:10px 16px;font-weight:750}.task-filter.active{background:#eef4ff;color:var(--blue);border-color:#93c5fd}
.task-card{display:flex;gap:12px;align-items:flex-start;cursor:pointer}.check{width:28px;height:28px;border:3px solid #b8c2d1;border-radius:9px;flex:none;margin-top:1px}.task-card.done .check{background:#16a34a;border-color:#16a34a;position:relative}.task-card.done .check:after{content:"✓";color:white;font-weight:900;position:absolute;left:4px;top:-4px;font-size:22px}.task-card.done .task-title{text-decoration:line-through;color:#6b7280}
.task-main{flex:1;min-width:0}.task-title{font-size:18px;font-weight:800}.task-meta{font-size:13px;color:var(--muted);margin-top:5px}.task-status{font-size:13px;font-weight:750;color:var(--muted);margin-top:5px}
.summary{font-size:14px;color:var(--muted);margin:0 0 12px}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:12px}.stat{background:#fff;border:1px solid var(--line);border-radius:24px;padding:18px;min-height:145px}.stat-icon{font-size:30px}.stat-num{font-size:48px;font-weight:850;line-height:1.05;margin-top:8px}.stat-label{font-size:18px;color:var(--muted);margin-top:4px}
.quick{background:#fff;border:1px solid var(--line);border-radius:24px;padding:18px;margin-top:12px}.quick h3{margin-bottom:14px}
nav{position:fixed;z-index:20;bottom:0;left:50%;transform:translateX(-50%);width:min(430px,100%);background:#fff;border-top:1px solid var(--line);display:grid;grid-template-columns:repeat(4,1fr);padding:10px 8px calc(10px + env(safe-area-inset-bottom))}
nav button{border:0;background:none;color:#6b7280;font-size:13px;padding:3px 0}.nav-icon{display:block;font-size:28px;line-height:1.1;margin-bottom:3px}.nav-active{color:var(--blue)!important;font-weight:800}
.modal{position:fixed;z-index:50;inset:0;background:rgba(0,0,0,.42);display:none;align-items:flex-end;justify-content:center}.modal.show{display:flex}.sheet{width:min(430px,100%);background:#fff;border-radius:28px 28px 0 0;padding:26px 18px calc(18px + env(safe-area-inset-bottom));max-height:92vh;overflow:auto}.sheet h2{margin-bottom:20px}
label{display:block;color:var(--muted);font-weight:750;margin:0 0 7px;font-size:15px}.field{margin-bottom:14px}input,select{width:100%;border:1px solid #d7dde7;border-radius:16px;background:#fff;padding:15px 14px;font-size:17px;outline:none}input:focus,select:focus{border-color:#75b8ff;box-shadow:0 0 0 3px #dbeeff}
.actions{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:8px}.actions button{min-height:54px}
.empty{padding:28px 10px;text-align:center;color:var(--muted)}
.ai-box{background:#111827;color:#fff;border-radius:22px;padding:18px}.ai-box input{background:#fff}.ai-answer{margin-top:14px;line-height:1.5}
.small{font-size:13px;color:var(--muted)}
@media(min-width:700px){body{padding:20px}.app{box-shadow:0 5px 30px rgba(0,0,0,.08);border-radius:24px;overflow:hidden}}
</style>
</head>
<body>
<div class="app">
<header>
  <div class="brand">BUILD<span>OS</span></div>
  <div class="greeting">Добрый день, Дмитрий 👋</div>
  <div class="subtitle">Вот что происходит на объектах</div>
</header>

<main class="content">
  <section id="home" class="view active">
    <div class="section-head"><h2>Мои объекты</h2><button class="secondary" onclick="showView('objects')">Все объекты →</button></div>
    <div id="homeObjects"></div>
    <h2 style="margin:28px 0 14px">Сегодня</h2>
    <div class="stats">
      <div class="stat"><div class="stat-icon">🔴</div><div id="overdue" class="stat-num">0</div><div class="stat-label">просрочено</div></div>
      <div class="stat"><div class="stat-icon">📋</div><div id="todayCount" class="stat-num">0</div><div class="stat-label">в работе</div></div>
      <div class="stat"><div class="stat-icon">💰</div><div id="expenseTotal" class="stat-num">0</div><div class="stat-label">расходы</div></div>
      <div class="stat"><div class="stat-icon">👷</div><div id="workersTotal" class="stat-num">0</div><div class="stat-label">рабочих</div></div>
    </div>
    <div class="quick">
      <h3>⚡ Быстрые действия</h3>
      <div class="grid">
        <button class="secondary" onclick="openTaskModal()">➕ Задача</button>
        <button class="secondary" onclick="showView('objects')">🏗️ Объекты</button>
        <button class="secondary" onclick="openExpenseModal()">💰 Расход</button>
        <button class="secondary" onclick="showView('ai')">🤖 Спросить AI</button>
      </div>
    </div>
  </section>

  <section id="objects" class="view">
    <div class="section-head"><h2>Мои объекты</h2></div>
    <div id="objectList"></div>
  </section>

  <section id="objectDetail" class="view">
    <div id="detail"></div>
  </section>

  <section id="tasks" class="view">
    <div class="section-head"><h2>Задачи</h2><button class="primary" style="width:auto" onclick="openTaskModal()">+ Добавить</button></div>
    <div class="task-tools">
      <button class="task-filter active" data-filter="all" onclick="setTaskFilter('all',this)">Все</button>
      <button class="task-filter" data-filter="open" onclick="setTaskFilter('open',this)">В работе</button>
      <button class="task-filter" data-filter="done" onclick="setTaskFilter('done',this)">Выполнены</button>
    </div>
    <p id="taskSummary" class="summary"></p>
    <div id="taskList"></div>
  </section>

  <section id="expenses" class="view">
    <div class="section-head"><h2>Расходы</h2><button class="primary" style="width:auto" onclick="openExpenseModal()">+ Добавить</button></div>
    <div class="card"><div class="row"><span>Всего расходов</span><b id="expensePageTotal">0 ₽</b></div></div>
    <div id="expenseList"></div>
  </section>

  <section id="ai" class="view">
    <div class="section-head"><h2>AI-помощник</h2></div>
    <div class="ai-box">
      <div style="font-size:20px;font-weight:800">🤖 Чем помочь?</div>
      <div class="small" style="color:#cbd5e1;margin:7px 0 14px">Спроси про задачи, сроки или расходы.</div>
      <input id="aiInput" placeholder="Например: что просрочено?">
      <button class="primary" style="margin-top:10px" onclick="askAI()">Спросить</button>
      <div id="aiAnswer" class="ai-answer"></div>
    </div>
  </section>
</main>
</div>

<nav>
  <button id="nav-home" class="nav-active" onclick="showView('home',this)"><span class="nav-icon">🏠</span>Главная</button>
  <button id="nav-objects" onclick="showView('objects',this)"><span class="nav-icon">🏗️</span>Объекты</button>
  <button id="nav-tasks" onclick="showView('tasks',this)"><span class="nav-icon">✅</span>Задачи</button>
  <button id="nav-ai" onclick="showView('ai',this)"><span class="nav-icon">🤖</span>AI</button>
</nav>

<div id="taskModal" class="modal" onclick="if(event.target===this)closeModal('taskModal')">
  <div class="sheet">
    <h2>Новая задача</h2>
    <div class="field"><label>Задача</label><input id="taskTitle" placeholder="Например: проверить электрику"></div>
    <div class="field"><label>Объект</label><select id="taskObject"></select></div>
    <div class="field"><label>Ответственный</label><input id="taskAssignee" placeholder="Например: Сергей"></div>
    <div class="field"><label>Срок</label><input id="taskDue" type="date"></div>
    <div class="field"><label>Приоритет</label><select id="taskPriority"><option value="high">🔴 Высокий</option><option value="medium" selected>🟠 Средний</option><option value="low">🟢 Низкий</option></select></div>
    <div class="actions"><button class="secondary" onclick="closeModal('taskModal')">Отмена</button><button class="primary" onclick="addTask()">Сохранить</button></div>
  </div>
</div>

<div id="expenseModal" class="modal" onclick="if(event.target===this)closeModal('expenseModal')">
  <div class="sheet">
    <h2>Новый расход</h2>
    <div class="field"><label>Объект</label><select id="expenseObject"></select></div>
    <div class="field"><label>Статья</label><input id="expenseCategory" placeholder="Материалы, рабочие, доставка..."></div>
    <div class="field"><label>Сумма</label><input id="expenseAmount" type="number" inputmode="decimal" placeholder="50000"></div>
    <div class="field"><label>Комментарий</label><input id="expenseComment" placeholder="Что купили?"></div>
    <div class="actions"><button class="secondary" onclick="closeModal('expenseModal')">Отмена</button><button class="primary" onclick="addExpense()">Добавить</button></div>
  </div>
</div>

<script>
const defaultObjects=[
 {name:"ЖК Хорошевский",city:"Москва",client:"Иван",budget:3200000,area:142,days:74,progress:64,stage:"Черновые работы",workers:6,start:"12 августа",finish:"25 октября",issues:2,icon:"🏗️",tasks:["Проверить электрику","Согласовать плитку","Фотоотчёт заказчику"]},
 {name:"Квартира №27",city:"Москва",client:"Анна",budget:1850000,area:87,days:61,progress:41,stage:"Подготовка",workers:4,start:"1 сентября",finish:"31 октября",issues:0,icon:"🏠",tasks:["Заказать сантехнику","Подготовить стены"]}
];
let objects=JSON.parse(localStorage.getItem("buildos_objects")||"null")||defaultObjects;
let tasks=JSON.parse(localStorage.getItem("buildos_tasks")||"null")||[
 {title:"Проверить электрику",object:"ЖК Хорошевский",assignee:"",due:"",priority:"high",done:false},
 {title:"Согласовать плитку",object:"ЖК Хорошевский",assignee:"",due:"",priority:"medium",done:true},
 {title:"Заказать сантехнику",object:"Квартира №27",assignee:"",due:"",priority:"medium",done:true},
 {title:"Подготовить стены",object:"Квартира №27",assignee:"",due:"",priority:"low",done:false},
 {title:"Фотоотчёт заказчику",object:"ЖК Хорошевский",assignee:"",due:"",priority:"medium",done:false}
];
let expenses=JSON.parse(localStorage.getItem("buildos_expenses")||"[]");
let taskFilter="all";

function save(){localStorage.setItem("buildos_tasks",JSON.stringify(tasks));localStorage.setItem("buildos_expenses",JSON.stringify(expenses));localStorage.setItem("buildos_objects",JSON.stringify(objects))}
function showView(id,btn){
 document.querySelectorAll(".view").forEach(v=>v.classList.remove("active"));
 const v=document.getElementById(id); if(v)v.classList.add("active");
 document.querySelectorAll("nav button").forEach(b=>b.classList.remove("nav-active"));
 const nav=document.getElementById("nav-"+id); if(nav)nav.classList.add("nav-active");
 if(id==="home")renderHome(); if(id==="objects")renderObjects(); if(id==="tasks")renderTasks(); if(id==="expenses")renderExpenses();
 window.scrollTo(0,0);
}
function money(n){return Number(n||0).toLocaleString("ru-RU")+" ₽"}
function objectOptions(id){
 document.getElementById(id).innerHTML=objects.map((o,i)=>`<option value="${o.name}">${o.name}</option>`).join("");
}
function renderHome(){
 document.getElementById("homeObjects").innerHTML=objects.map((o,i)=>objectCard(o,i,true)).join("");
 const open=tasks.filter(t=>!t.done).length;
 const overdue=tasks.filter(t=>!t.done&&t.due&&new Date(t.due+"T23:59:59")<new Date()).length;
 document.getElementById("todayCount").textContent=open;
 document.getElementById("overdue").textContent=overdue;
 document.getElementById("expenseTotal").textContent=expenses.reduce((s,e)=>s+Number(e.amount||0),0).toLocaleString("ru-RU");
 document.getElementById("workersTotal").textContent=objects.reduce((s,o)=>s+Number(o.workers||0),0);
}
function objectCard(o,i,home=false){
 return `<div class="card object-card">
   <div class="object-top"><div class="icon">${o.icon}</div><div><div class="object-name">${o.name}</div><div class="object-meta">${o.area} м² · срок ${o.days} дней</div></div></div>
   <div class="progress"><i style="width:${o.progress}%"></i></div>
   <div class="status ${o.issues?'bad':'ok'}">${o.issues?'⚠️ '+o.issues+' проблем':'🟢 Всё по плану'} · выполнено ${o.progress}%</div>
   <button class="primary" style="margin-top:16px" onclick="openObject(${i})">Открыть объект →</button>
 </div>`;
}
function renderObjects(){document.getElementById("objectList").innerHTML=objects.map((o,i)=>objectCard(o,i)).join("")||'<div class="empty">Объектов пока нет</div>'}
function openObject(i){
 const o=objects[i];
 document.getElementById("detail").innerHTML=`<div class="card">
 <div class="object-top"><div class="icon">${o.icon}</div><div><div class="detail-title">${o.name}</div><div class="object-meta">${o.city} · ${o.area} м²</div></div></div>
 <div class="progress"><i style="width:${o.progress}%"></i></div><div style="margin-top:12px;font-size:18px;font-weight:800">Готовность ${o.progress}%</div>
 </div>
 <div class="detail-card"><h3>📋 Основная информация</h3>
 <div class="row"><span>Клиент</span><b>${o.client}</b></div><div class="row"><span>Бюджет</span><b>${money(o.budget)}</b></div><div class="row"><span>Этап</span><span>${o.stage}</span></div><div class="row"><span>Рабочие</span><span>${o.workers} человек</span></div><div class="row"><span>Начало</span><span>${o.start}</span></div><div class="row"><span>Сдача</span><span>${o.finish}</span></div></div>
 <div class="detail-card"><h3>⚠️ Контроль</h3><div class="row"><span>Проблемы</span><b style="color:${o.issues?'var(--red)':'var(--green)'}">${o.issues}</b></div><div class="row"><span>Задач объекта</span><b>${tasks.filter(t=>t.object===o.name).length}</b></div><div class="row"><span>Срок</span><b>${o.days} дней</b></div></div>
 <div class="detail-card"><h3>📋 Задачи объекта</h3>${tasks.filter(t=>t.object===o.name).map(t=>`<div class="row"><span>${t.done?'✅':'⬜'} ${t.title}</span></div>`).join("")||'<div class="small">Задач пока нет.</div>'}</div>
 <div class="grid"><button class="secondary" onclick="openTaskModal('${o.name}')">+ Задача</button><button class="secondary" onclick="openExpenseModal('${o.name}')">💰 Расход</button></div>`;
 showView("objectDetail");
}
function setTaskFilter(f,btn){taskFilter=f;document.querySelectorAll(".task-filter").forEach(b=>b.classList.remove("active"));btn.classList.add("active");renderTasks()}
function priorityLabel(p){return p==="high"?"Высокий":p==="low"?"Низкий":"Средний"}
function renderTasks(){
 let list=tasks.filter(t=>taskFilter==="all"?true:taskFilter==="done"?t.done:!t.done);
 const open=tasks.filter(t=>!t.done).length, done=tasks.filter(t=>t.done).length;
 document.getElementById("taskSummary").textContent=`Всего: ${tasks.length} · В работе: ${open} · Выполнено: ${done}`;
 document.getElementById("taskList").innerHTML=list.length?list.map((t)=>{
  const i=tasks.indexOf(t),due=t.due?new Date(t.due+"T00:00:00").toLocaleDateString("ru-RU"):"без срока";
  return `<div class="card task-card ${t.done?'done':''}" onclick="toggleTask(${i})"><div class="check"></div><div class="task-main"><div class="task-title">${t.title}</div><div class="task-meta">🏗️ ${t.object} · 👷 ${t.assignee||"Не назначен"} · 📅 ${due}</div><div class="task-status">${t.done?"✓ Выполнено":"В работе"} · ${priorityLabel(t.priority)} приоритет</div></div></div>`;
 }).join(""):'<div class="empty">Задач в этом разделе нет.</div>';
 renderHome();
}
function toggleTask(i){tasks[i].done=!tasks[i].done;save();renderTasks()}
function openTaskModal(objectName){
 objectOptions("taskObject");if(objectName)document.getElementById("taskObject").value=objectName;
 document.getElementById("taskTitle").value="";document.getElementById("taskAssignee").value="";document.getElementById("taskDue").value="";document.getElementById("taskPriority").value="medium";
 document.getElementById("taskModal").classList.add("show");setTimeout(()=>document.getElementById("taskTitle").focus(),50);
}
function addTask(){
 const title=document.getElementById("taskTitle").value.trim();if(!title)return;
 tasks.unshift({title,object:document.getElementById("taskObject").value,assignee:document.getElementById("taskAssignee").value.trim(),due:document.getElementById("taskDue").value,priority:document.getElementById("taskPriority").value,done:false});
 save();closeModal("taskModal");showView("tasks");
}
function renderExpenses(){
 const total=expenses.reduce((s,e)=>s+Number(e.amount||0),0);
 document.getElementById("expensePageTotal").textContent=money(total);
 document.getElementById("expenseList").innerHTML=expenses.length?expenses.slice().reverse().map(e=>`<div class="card"><div class="row"><span>${e.category||"Расход"}</span><b>${money(e.amount)}</b></div><div class="small">${e.object}${e.comment?" · "+e.comment:""} · ${e.date}</div></div>`).join(""):'<div class="empty">Расходов пока нет.</div>';
}
function openExpenseModal(objectName){objectOptions("expenseObject");if(objectName)document.getElementById("expenseObject").value=objectName;document.getElementById("expenseCategory").value="";document.getElementById("expenseAmount").value="";document.getElementById("expenseComment").value="";document.getElementById("expenseModal").classList.add("show")}
function addExpense(){
 const amount=Number(document.getElementById("expenseAmount").value);if(!amount)return;
 expenses.push({object:document.getElementById("expenseObject").value,category:document.getElementById("expenseCategory").value.trim()||"Расход",amount,comment:document.getElementById("expenseComment").value.trim(),date:new Date().toLocaleDateString("ru-RU")});
 save();closeModal("expenseModal");showView("expenses");
}
function closeModal(id){document.getElementById(id).classList.remove("show")}
function askAI(){
 const q=document.getElementById("aiInput").value.toLowerCase().trim(),a=document.getElementById("aiAnswer");
 if(q.includes("просроч")){const n=tasks.filter(t=>!t.done&&t.due&&new Date(t.due+"T23:59:59")<new Date()).length;a.innerHTML=`Просроченных задач: <b>${n}</b>.`;return}
 if(q.includes("расход")){a.innerHTML=`Всего расходов: <b>${money(expenses.reduce((s,e)=>s+Number(e.amount||0),0))}</b>.`;return}
 if(q.includes("завтра")){a.innerHTML=`На данный момент в задачах нет отдельного планировщика уведомлений. Задачи со сроками сохраняются в приложении.`;return}
 a.innerHTML=`Сейчас я могу помочь с быстрым анализом: <b>просроченных задач</b>, <b>расходов</b> и текущего списка задач.`;
}
function init(){objectOptions("taskObject");objectOptions("expenseObject");renderHome();renderObjects();renderTasks();renderExpenses()}
init();
</script>
</body>
</html>
